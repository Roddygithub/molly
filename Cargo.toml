[package]
name = "molly-matter-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
matter-controller = { version = "=0.18.3", default-features = false }
tokio = { version = "1", features = ["macros", "rt", "time"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"
